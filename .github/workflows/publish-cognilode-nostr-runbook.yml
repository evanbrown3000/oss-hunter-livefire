name: Publish Cognilode Nostr runbook

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  publish:
    if: startsWith(github.event.issue.title, 'RUN_COGNILODE_NOSTR_RUNBOOK_20260819')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Publish signed event and verify relay readback
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check -q 'websockets>=14,<16'
          cat > /tmp/publish.py <<'PY'
          import asyncio,json,pathlib
          import websockets

          event={"id":"2ed197a948e0655f8be7b03dbe44ee1f5d413bbf0ba13c39b273bec3fa124dcd","pubkey":"618e9a1fdca878de40aa20dca7a9f4082e3acdec4cc2fabae3f4c8bc04be0880","created_at":1787167527,"kind":1,"tags":[["t","ai-agent"],["t","incident-response"],["t","agentic-ai"],["t","llmops"]],"content":"AI Agent Incident Response Runbook — a practical sequence for tool-using/LLM agents when provider, browser, deployment, retry, or custody failures cross layers.\n\nFree public runbook: https://github.com/evanbrown3000/oss-hunter-livefire/blob/main/AI_AGENT_INCIDENT_RESPONSE_RUNBOOK.md\n\nFull production kit ($109, instant download): https://buy.stripe.com/dRmeVd5uh0CP09NaaugQE01?utm_source=nostr&utm_medium=social&utm_campaign=agentic_ir_kit_20260819&utm_content=cognilode_note&client_reference_id=nostr_cognilode_ir_kit\n\nCore rule: verify recovery at the external outcome boundary, not just from a green process or HTTP 200.","sig":"ea88a3fde0706e813dabb2a7e41174dd019563acdb42ad95d431bf368e0e68ee9d3d17554b236f49ab075f8e808a9a41b263071d4d2d236b289c7367de5cbdd5"}
          relays=['wss://relay.damus.io','wss://nos.lol','wss://relay.primal.net']

          async def one(url):
              out={'relay':url,'ok':False,'accepted':False,'readback':False,'messages':[]}
              try:
                  async with websockets.connect(url,open_timeout=12,close_timeout=5,ping_interval=None,max_size=2_000_000) as ws:
                      await ws.send(json.dumps(['EVENT',event],separators=(',',':')))
                      deadline=asyncio.get_running_loop().time()+12
                      while asyncio.get_running_loop().time()<deadline:
                          try: msg=await asyncio.wait_for(ws.recv(),timeout=max(0.2,deadline-asyncio.get_running_loop().time()))
                          except asyncio.TimeoutError: break
                          try: obj=json.loads(msg)
                          except Exception: continue
                          out['messages'].append(obj[:4] if isinstance(obj,list) else obj)
                          if isinstance(obj,list) and len(obj)>=3 and obj[0]=='OK' and obj[1]==event['id']:
                              out['ok']=True; out['accepted']=bool(obj[2]); break
                      sub='verify-'+event['id'][:8]
                      await ws.send(json.dumps(['REQ',sub,{'ids':[event['id']]}],separators=(',',':')))
                      deadline=asyncio.get_running_loop().time()+10
                      while asyncio.get_running_loop().time()<deadline:
                          try: msg=await asyncio.wait_for(ws.recv(),timeout=max(0.2,deadline-asyncio.get_running_loop().time()))
                          except asyncio.TimeoutError: break
                          try: obj=json.loads(msg)
                          except Exception: continue
                          if isinstance(obj,list) and len(obj)>=3 and obj[0]=='EVENT' and obj[1]==sub and isinstance(obj[2],dict) and obj[2].get('id')==event['id']:
                              out['readback']=True; break
                          if isinstance(obj,list) and len(obj)>=2 and obj[0]=='EOSE' and obj[1]==sub: break
                      await ws.send(json.dumps(['CLOSE',sub]))
              except Exception as e:
                  out['error']=f'{type(e).__name__}: {e}'[:500]
              return out

          async def main():
              results=await asyncio.gather(*(one(r) for r in relays))
              summary={'event_id':event['id'],'pubkey':event['pubkey'],'results':results,'accepted_count':sum(1 for r in results if r['accepted']),'readback_count':sum(1 for r in results if r['readback'])}
              pathlib.Path('/tmp/nostr-result.json').write_text(json.dumps(summary,indent=2)+'\n')
              print(json.dumps(summary))
          asyncio.run(main())
          PY
          python /tmp/publish.py
      - name: Record terminal result and close trigger
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json,os,pathlib,urllib.request
          try: res=json.loads(pathlib.Path('/tmp/nostr-result.json').read_text())
          except Exception as e: res={'event_id':'2ed197a948e0655f8be7b03dbe44ee1f5d413bbf0ba13c39b273bec3fa124dcd','carrier_error':str(e)}
          compact={'event_id':res.get('event_id'),'accepted_count':res.get('accepted_count',0),'readback_count':res.get('readback_count',0),'results':[{'relay':r.get('relay'),'accepted':r.get('accepted'),'readback':r.get('readback'),'error':r.get('error')} for r in res.get('results',[])]}
          body='COGNILODE_NOSTR_RUNBOOK_RESULT `'+json.dumps(compact,separators=(',',':'))+'`'
          repo=os.environ['GITHUB_REPOSITORY']; n=os.environ['ISSUE_NUMBER']; token=os.environ['GH_TOKEN']
          h={'Authorization':'Bearer '+token,'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'}
          u=f'https://api.github.com/repos/{repo}/issues/{n}/comments'
          req=urllib.request.Request(u,data=json.dumps({'body':body}).encode(),headers=h,method='POST')
          with urllib.request.urlopen(req,timeout=30): pass
          u=f'https://api.github.com/repos/{repo}/issues/{n}'
          req=urllib.request.Request(u,data=json.dumps({'state':'closed'}).encode(),headers=h,method='PATCH')
          with urllib.request.urlopen(req,timeout=30): pass
          PY
