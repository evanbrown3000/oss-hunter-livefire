name: Bounded ChatGPT cloud login probe

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - baton/login_probe_trigger.txt

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  probe:
    if: github.event.pull_request.user.login == 'evanbrown3000' && github.event.pull_request.head.ref == 'chatgpt-cloud-baton-chain'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      CHATGPT_LOGIN_EMAIL: evanbrown3000@gmail.com
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install browser runtime
        run: |
          python -m pip install --disable-pip-version-check --quiet playwright==1.55.0 requests==2.32.4
          python -m playwright install --with-deps chromium

      - name: Capture the exact post-email ChatGPT login state
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RUN_ID: ${{ github.run_id }}
        run: xvfb-run -a python baton/login_probe.py

      - name: Preserve bounded visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chatgpt-login-probe-${{ github.run_id }}
          path: |
            /tmp/chatgpt-login-probe.json
            /tmp/chatgpt-login-probe.png
          if-no-files-found: warn
          retention-days: 1
