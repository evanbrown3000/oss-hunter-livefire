name: Publish Agentic IR Kit release

on:
  push:
    paths:
      - '.github/workflows/publish-agentic-ir-kit-release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish commercial release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view agentic-ir-kit-2026 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 && exit 0
          gh release create agentic-ir-kit-2026 \
            --repo "$GITHUB_REPOSITORY" \
            --title "Agentic AI Incident Response Kit 2026 — Commercial Edition" \
            --notes $'Production incident-response toolkit for engineering teams operating tool-using AI agents, LLM workflows, browser automation and multi-agent systems.\n\nPrice: $109 one-time, instant digital delivery.\n\nFree preview: https://github.com/evanbrown3000/oss-hunter-livefire/blob/main/products/agentic-ir-kit-2026/FREE_PREVIEW.md\n\nBuy securely with Stripe: https://buy.stripe.com/dRmeVd5uh0CP09NaaugQE01'
